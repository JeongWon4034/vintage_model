# ============ VTON 데모 설정 ============

# --- VTON 백엔드 (HF Space) ---
vton:
  # 1순위 Space. 여기가 다운/변경되면 아래 fallbacks 로 자동 재시도.
  space: "yisol/IDM-VTON"
  fallbacks:
    - "AI-Platform/Virtual-Try-On"
    - "kadirnar/IDM-VTON"
  api_name: "/tryon"     # gradio 엔드포인트 이름
  denoise_steps: 30
  seed: 42
  auto_mask: true        # IDM-VTON 자동 인물 마스킹 사용
  crop: false            # 결과 crop 여부
  timeout_sec: 600       # Space 큐/콜드스타트 대기 허용치

# --- 크롤러 ---
crawler:
  # 크롤 시작 URL. 상품 그리드가 있는 검색/카테고리 페이지여야 상품컷이 나온다.
  # (홈 '/' 은 배너 위주라 상품 이미지가 거의 없음)
  # VTON 이 잘하는 "질감 위주" 아이템을 키워드로 타겟 (프린트/그래픽은 약하므로 제외)
  start_urls:
    - "https://fruitsfamily.com/search?q=니트"
    - "https://fruitsfamily.com/search?q=플리스"
    - "https://fruitsfamily.com/search?q=코듀로이"
    - "https://fruitsfamily.com/search?q=스웨이드"
    - "https://fruitsfamily.com/search?q=무스탕"
    - "https://fruitsfamily.com/search?q=가죽자켓"
    - "https://fruitsfamily.com/search?q=플란넬"
  image_host: "image.production.fruitsfamily.com"   # 이 호스트 이미지만 수집
  # 상품 카드 이미지 경로 조각(하나라도 포함되면 상품컷으로 간주). 배너/브랜드로고 제외용.
  image_path_include:
    - "/product/"
    - "/collection/"
  image_path_exclude:
    - "/banner/"
    - "/brand/"
    - "/profile/"
  default_count: 5
  min_width: 600          # 썸네일/아이콘 제거용 최소 가로폭(px). CDN 원본이 620px 이므로 600 이 상한선
  prefer_portrait: true   # 세로형(상품컷) 우선
  garment_only: false     # true 면 mediapipe 로 착용샷 제외(미설치 시 에러). false = 전부 수집 후 수동 셀렉
  request_delay_sec: 1.0  # 예의상 요청 간 간격
  headless: true

# --- 모델(사람) 스펙 ---
# 실측(cm) → 픽셀 환산의 기준. 모델 사진을 바꾸면 키만 여기서 수정하면 된다.
model_spec:
  height_cm: 168        # 모델 키
  shoulder_cm: 38       # 어깨 너비 (핏 판정용)
  chest_cm: 84          # 가슴 둘레 (핏 판정용)

# --- 전처리 ---
preprocess:
  remove_background: true   # rembg 로 옷 배경 제거
  bg_color: [255, 255, 255] # 제거 후 채울 배경색 (VTON 은 흰 배경 상품컷을 선호)

# --- 경로 (프로젝트 루트 기준) ---
paths:
  models_dir: "models"
  garments_dir: "data/garments"
  results_dir: "data/results"
