<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>모델 마스터 컷 승인</title>
  <style>
    :root { --bg:#0b0d11; --card:#151922; --line:#232a36; --fg:#e8ecf3; --sub:#8b95a7; --accent:#7c5cff; --ok:#2fbf71; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo",sans-serif; }
    .top { padding:24px 28px 8px; }
    h1 { font-size:20px; margin:0 0 4px; }
    .top p { color:var(--sub); margin:0; font-size:14px; }
    .wrap { padding:20px 28px 60px; display:flex; flex-wrap:wrap; gap:24px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; width:360px; }
    .card.lead { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
    .imgbox { position:relative; background:#fff; }
    .imgbox img { width:100%; display:block; }
    .tag { position:absolute; top:12px; left:12px; background:var(--accent); color:#fff; font-size:12px; font-weight:600; padding:4px 10px; border-radius:999px; }
    .tag.done { background:var(--ok); }
    .meta { padding:16px 18px; }
    .meta .name { font-size:16px; font-weight:600; margin-bottom:8px; }
    .row { display:flex; justify-content:space-between; font-size:13px; color:var(--sub); padding:3px 0; }
    .row b { color:var(--fg); font-weight:500; }
    .empty { color:var(--sub); padding:40px; }
    .foot { padding:0 28px; color:var(--sub); font-size:13px; line-height:1.7; max-width:760px; }
    .foot code { background:#1c2230; padding:2px 7px; border-radius:6px; color:#cbd3e1; }
    .cta { display:inline-block; margin-top:8px; background:var(--accent); color:#fff; font-weight:600; padding:10px 18px; border-radius:10px; text-decoration:none; }
  </style>
</head>
<body>
  <div class="top">
    <h1>🧍 모델 마스터 컷 — 승인 대기</h1>
    <p>360° 생성 전에 정면 마스터 컷을 확인하세요. 보라색 테두리가 360°용 리드 모델입니다.</p>
  </div>
  <div class="wrap" id="wrap"><div class="empty">불러오는 중…</div></div>
  <div class="foot" id="foot"></div>

  <script>
    const imgUrl = (name) => `/img/model/${encodeURIComponent(name)}`;
    async function load() {
      const wrap = document.getElementById('wrap');
      let data;
      try {
        const r = await fetch('/api/masters');
        if (!r.ok) throw new Error(r.status);
        data = await r.json();
      } catch (e) {
        wrap.innerHTML = `<div class="empty">⚠️ 서버 연결 실패. 파일로 열지 말고 <code>http://localhost:8000/review</code> 로 접속하세요.</div>`;
        return;
      }
      const masters = data.masters || [];
      if (!masters.length) { wrap.innerHTML = '<div class="empty">아직 채택된 모델이 없습니다.</div>'; return; }
      // 리드 = female_avg 우선, 없으면 첫 번째
      const leadStem = (masters.find(m => m.stem.startsWith('female')) || masters[0]).stem;
      wrap.innerHTML = '';
      for (const m of masters) {
        const isLead = m.stem === leadStem;
        const hasAngles = m.angle_count > 1;
        const card = document.createElement('div');
        card.className = 'card' + (isLead ? ' lead' : '');
        card.innerHTML = `
          <div class="imgbox">
            <span class="tag ${hasAngles ? 'done' : ''}">${isLead ? '⭐ 360° 리드' : '모델'}</span>
            <img src="${imgUrl(m.name)}" alt="${m.stem}">
          </div>
          <div class="meta">
            <div class="name">${m.stem}</div>
            <div class="row"><span>해상도</span><b>${m.width}×${m.height}</b></div>
            <div class="row"><span>생성 엔진</span><b>Higgsfield soul_2</b></div>
            <div class="row"><span>360° 각도</span><b>${hasAngles ? m.angle_count + '컷 완료' : '미생성'}</b></div>
          </div>`;
        wrap.appendChild(card);
      }
      document.getElementById('foot').innerHTML = `
        마음에 드시면 채팅에 <b>"승인"</b> 이라고 입력하세요 →
        리드 모델(<code>${leadStem}</code>)의 360° 세트(45·90·180·270·315°)를 생성합니다.<br>
        다른 모델로 바꾸거나 다시 뽑고 싶으면 그렇게 말씀하세요.`;
    }
    load();
  </script>
</body>
</html>
